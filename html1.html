<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aspirasi Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Variabel warna & ukuran ===== */
:root {
  --sky-top: #cfe6fb;
  --sky-bottom: #eaf3fd;
  --navy: #1b3a8a;
  --blue: #2f6be6;
  --blue-dark: #2558c7;
  --logo-bg: #5b56d6;
  --text: #16181d;
  --muted: #4b5563;
  --line: #e3e7ee;
  --field-bg: #fafbfc;
  --card-radius: 22px;
}

/* ===== Reset sederhana ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  background: #f4f7fb;
}

/* Teks yang hanya terbaca oleh screen reader */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ===== Layout utama (2 kolom) ===== */
.page {
  flex: 1;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  align-items: center;
  gap: 24px;
  padding: 24px clamp(16px, 4vw, 48px) 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
}

/* ===== Bagian kiri: ilustrasi ===== */
.hero {
  position: relative;
  align-self: stretch;
  min-height: 460px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}

.bubble {
  position: relative;
  z-index: 2;
  width: min(440px, 88%);
  padding: 44px 36px;
  margin-bottom: 8px;
  background: #ffffff;
  border-radius: 50%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(27, 58, 138, 0.12);
}

.bubble p {
  font-size: clamp(1.25rem, 2.4vw, 1.75rem);
  font-weight: 800;
  line-height: 1.35;
  color: var(--navy);
}

/* ekor gelembung bicara */
.bubble::after {
  content: "";
  position: absolute;
  bottom: -18px;
  left: 30%;
  width: 40px;
  height: 40px;
  background: #ffffff;
  clip-path: polygon(0 0, 100% 0, 60% 100%);
}

/* gedung sekolah sederhana di belakang siswa */
.school {
  position: absolute;
  z-index: 0;
  left: 20%;
  bottom: 60px;
  width: 42%;
  height: 34%;
  background:
    repeating-linear-gradient(90deg, #ffffff 0 16px, transparent 16px 34px) 12% 60% / 76% 26% no-repeat,
    linear-gradient(#dbe8f7, #c9dbf1);
  border-radius: 6px 6px 0 0;
  opacity: 0.85;
}

.school::before {
  content: "";
  position: absolute;
  top: -22px;
  left: 25%;
  width: 50%;
  height: 26px;
  background: #d3e2f4;
  border-radius: 40px 40px 0 0;
}

.students {
  position: relative;
  z-index: 1;
  width: min(600px, 100%);
  height: auto;
  display: block;
}

/* ===== Bagian kanan: kartu login ===== */
.login-card {
  width: 100%;
  max-width: 460px;
  justify-self: center;
  padding: 44px 40px 36px;
  background: #ffffff;
  border-radius: var(--card-radius);
  text-align: center;
  box-shadow: 0 18px 45px rgba(27, 58, 138, 0.14);
}

.logo {
  width: 68px;
  height: 68px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  color: #ffffff;
  background: var(--logo-bg);
  border-radius: 18px;
}

.logo svg {
  width: 36px;
  height: 36px;
}

.login-card h1 {
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.subtitle {
  margin: 10px 0 30px;
  font-size: 0.98rem;
  line-height: 1.55;
  color: var(--muted);
}

/* ===== Form ===== */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field {
  position: relative;
}

.field .icon {
  position: absolute;
  top: 50%;
  left: 16px;
  width: 22px;
  height: 22px;
  transform: translateY(-50%);
  color: #4b5563;
  pointer-events: none;
}

.field input {
  width: 100%;
  height: 56px;
  padding: 0 52px 0 50px;
  font: inherit;
  font-size: 1rem;
  color: var(--text);
  background: var(--field-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.field input::placeholder {
  color: #6b7280;
}

.field input:focus {
  outline: none;
  background: #ffffff;
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(47, 107, 230, 0.18);
}

.toggle {
  position: absolute;
  top: 50%;
  right: 10px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  transform: translateY(-50%);
  color: #4b5563;
  background: none;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}

.toggle svg {
  width: 22px;
  height: 22px;
}

.toggle:hover {
  background: #eef2f7;
}

.toggle:focus-visible,
.btn-login:focus-visible {
  outline: 3px solid rgba(47, 107, 230, 0.5);
  outline-offset: 2px;
}

.btn-login {
  height: 54px;
  margin-top: 6px;
  font: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  color: #ffffff;
  background: var(--blue);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.btn-login:hover {
  background: var(--blue-dark);
}

.btn-login:active {
  transform: translateY(1px);
}

.help {
  margin-top: 26px;
  font-size: 0.92rem;
  color: var(--text);
}

/* ===== Footer ===== */
.footer {
  padding: 18px 16px;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
  background: #ffffff;
}

/* ===== Responsif: tablet ===== */
@media (max-width: 960px) {
  .page {
    grid-template-columns: 1fr;
    gap: 8px;
    padding-top: 32px;
  }

  /* kartu login tampil di atas, ilustrasi di bawah */
  .login-card {
    order: 1;
  }

  .hero {
    order: 2;
    min-height: 0;
    padding-top: 32px;
  }

  .bubble {
    width: min(380px, 90%);
    padding: 32px 26px;
  }

  .school {
    left: 24%;
    width: 46%;
  }
}

/* ===== Responsif: HP ===== */
@media (max-width: 520px) {
  .page {
    padding: 20px 14px 0;
  }

  .login-card {
    padding: 32px 22px 28px;
    border-radius: 18px;
  }

  .login-card h1 {
    font-size: 1.6rem;
  }

  .field input {
    height: 52px;
  }

  .bubble {
    padding: 26px 18px;
  }

  .bubble::after {
    bottom: -14px;
    width: 30px;
    height: 30px;
  }
}

/* Hormati pengguna yang mengurangi animasi */
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
/* ===== Variabel warna & ukuran ===== */
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --line: #e5e9f0;
  --text: #16181d;
  --muted: #4b5563;
  --blue: #2f6be6;
  --blue-dark: #2558c7;
  --blue-soft: #eaf1fe;
  --logo-bg: #5b56d6;
  --yellow: #f5b71c;
  --sky: #4a95f0;
  --green: #22a06b;
  --sidebar-w: 270px;
  --topbar-h: 72px;
}

/* ===== Reset sederhana ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid rgba(47, 107, 230, 0.5);
  outline-offset: 2px;
}

/* Checkbox penggerak menu HP disembunyikan */
.menu-toggle {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* ===== Kerangka halaman ===== */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  background: var(--surface);
}

/* ===== Topbar ===== */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-left: auto;
}

.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  border-radius: 10px;
  color: #1f2937;
}

.icon-btn:hover {
  background: #eef2f7;
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 4px 4px;
  background: none;
  border: 0;
  border-radius: 999px;
}

.profile:hover {
  background: #eef2f7;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  overflow: hidden;
  display: block;
}

.avatar svg {
  width: 100%;
  height: 100%;
  display: block;
}

.profile-name {
  font-size: 0.95rem;
  font-weight: 500;
}

.chevron {
  width: 18px;
  height: 18px;
  color: #4b5563;
}

/* Tombol hamburger hanya muncul di layar kecil */
.hamburger {
  display: none;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 10px;
  color: #1f2937;
  cursor: pointer;
}

.hamburger:hover {
  background: #eef2f7;
}

.hamburger svg {
  width: 24px;
  height: 24px;
}

/* ===== Sidebar ===== */
.sidebar {
  grid-area: sidebar;
  padding: 24px 16px;
  background: var(--surface);
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 12px 30px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  color: #ffffff;
  background: var(--logo-bg);
  border-radius: 12px;
}

.brand-logo svg {
  width: 22px;
  height: 22px;
}

.brand-name {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
  padding: 0 20px;
  font-size: 0.98rem;
  font-weight: 500;
  color: #2b3240;
  border-radius: 12px;
  transition: background 0.2s;
}

.nav-item svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.nav-item:hover {
  background: #eef2f7;
}

.nav-item.active {
  color: #ffffff;
  font-weight: 600;
  background: var(--blue);
}

/* ===== Konten utama ===== */
.content {
  grid-area: content;
  padding: 36px clamp(20px, 3.5vw, 48px) 48px;
  background: var(--surface);
}

.welcome {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 32px;
}

.welcome h1 {
  font-size: clamp(1.6rem, 3vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.welcome p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.98rem;
}

.btn-primary {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 28px;
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
  background: var(--blue);
  border-radius: 12px;
  transition: background 0.2s, transform 0.1s;
}

.btn-primary:hover {
  background: var(--blue-dark);
}

.btn-primary:active {
  transform: translateY(1px);
}

.btn-primary svg {
  width: 20px;
  height: 20px;
}

/* ===== Kartu statistik ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 44px;
}

.stat-card {
  padding: 22px 22px 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
}

.stat-top strong {
  font-size: 1.85rem;
  font-weight: 700;
  line-height: 1;
}

.stat-card p {
  margin-top: 12px;
  font-size: 0.95rem;
  color: var(--muted);
}

.stat-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  color: #ffffff;
  border-radius: 50%;
}

.stat-icon svg {
  width: 18px;
  height: 18px;
}

.stat-icon.yellow { background: var(--yellow); }
.stat-icon.blue   { background: var(--sky); }
.stat-icon.green  { background: var(--green); }

/* ===== Aspirasi terbaru ===== */
.recent-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.recent-head h2 {
  font-size: 1.2rem;
  font-weight: 700;
}

.link {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--blue);
}

.link:hover {
  text-decoration: underline;
}

.recent-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}

/* Tampilan saat belum ada data */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 24px 56px;
  text-align: center;
}

.empty-icon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  color: var(--blue);
  background: var(--blue-soft);
  border-radius: 18px;
}

.empty-icon svg {
  width: 32px;
  height: 32px;
}

.empty h3 {
  font-size: 1.1rem;
  font-weight: 600;
}

.empty p {
  margin: 6px 0 22px;
  font-size: 0.95rem;
  color: var(--muted);
}

.btn-outline {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 22px;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--blue);
  border: 1.5px solid var(--blue);
  border-radius: 10px;
  transition: background 0.2s;
}

.btn-outline:hover {
  background: var(--blue-soft);
}

/* Lapisan gelap: sembunyi di desktop */
.overlay {
  display: none;
}

/* ===== Responsif: layar sedang (kartu jadi 2 kolom) ===== */
@media (max-width: 1100px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* ===== Responsif: tablet & HP (sidebar jadi menu geser) ===== */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "topbar"
      "content";
  }

  .topbar {
    padding: 0 16px;
  }

  .hamburger {
    display: grid;
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 30;
    width: min(290px, 82vw);
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: 8px 0 30px rgba(15, 23, 42, 0.15);
  }

  .menu-toggle:checked ~ .app .sidebar {
    transform: translateX(0);
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: block;
    background: rgba(15, 23, 42, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .menu-toggle:checked ~ .app .overlay {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-toggle:focus-visible ~ .app .hamburger {
    outline: 3px solid rgba(47, 107, 230, 0.5);
  }
}

/* ===== Responsif: HP ===== */
@media (max-width: 600px) {
  .welcome {
    flex-direction: column;
    align-items: stretch;
  }

  .btn-primary {
    justify-content: center;
  }

  .stats {
    gap: 12px;
    margin-bottom: 36px;
  }

  .stat-card {
    padding: 16px;
  }

  .profile-name {
    display: none;
  }

  .content {
    padding-top: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
/* ===== CSS khusus halaman Kirim Aspirasi =====
   Kerangka halaman (topbar, sidebar, warna) ada di beranda.css */

.page-head h1 {
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.page-head p {
  margin-top: 10px;
  font-size: 0.98rem;
  color: var(--muted);
}

/* ===== Form ===== */
.aspirasi-form {
  max-width: 800px;
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.form-group label {
  font-size: 0.98rem;
  font-weight: 600;
}

.aspirasi-form input,
.aspirasi-form select,
.aspirasi-form textarea {
  width: 100%;
  font: inherit;
  font-size: 0.98rem;
  color: var(--text);
  background: #fafbfc;
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.aspirasi-form input,
.aspirasi-form select {
  height: 52px;
  padding: 0 18px;
}

.aspirasi-form input::placeholder,
.aspirasi-form textarea::placeholder {
  color: #6b7280;
}

.aspirasi-form input:focus,
.aspirasi-form select:focus,
.aspirasi-form textarea:focus {
  outline: none;
  background: #ffffff;
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(47, 107, 230, 0.18);
}

/* ===== Dropdown kategori ===== */
.select-wrap {
  position: relative;
}

.select-wrap select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 48px;
  cursor: pointer;
}

/* warna abu-abu saat masih "Pilih kategori" */
.select-wrap select:invalid {
  color: #6b7280;
}

.select-wrap svg {
  position: absolute;
  top: 50%;
  right: 18px;
  width: 20px;
  height: 20px;
  transform: translateY(-50%);
  color: #1f2937;
  pointer-events: none;
}

/* ===== Textarea + penghitung karakter ===== */
.textarea-wrap {
  position: relative;
}

.textarea-wrap textarea {
  min-height: 190px;
  padding: 16px 18px 44px;
  line-height: 1.6;
  resize: vertical;
}

.counter {
  position: absolute;
  right: 18px;
  bottom: 14px;
  font-size: 0.85rem;
  color: var(--muted);
  pointer-events: none;
}

/* ===== Tombol ===== */
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  margin-top: 4px;
}

.btn-cancel {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 52px;
  min-width: 140px;
  padding: 0 28px;
  font-size: 1rem;
  font-weight: 600;
  color: #1f2937;
  background: #f3f5f8;
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: background 0.2s;
}

.btn-cancel:hover {
  background: #e8ecf2;
}

/* tombol kirim: memakai .btn-primary dari beranda.css, ditambah reset untuk <button> */
.btn-submit {
  border: 0;
  font-family: inherit;
  cursor: pointer;
}

/* ===== Responsif ===== */
@media (max-width: 600px) {
  .aspirasi-form {
    margin-top: 24px;
    gap: 20px;
  }

  .form-actions {
    flex-direction: column-reverse;
  }

  .btn-cancel,
  .btn-submit {
    width: 100%;
    justify-content: center;
  }
}
/* ===== CSS halaman Aspirasi Saya & Detail Aspirasi =====
   Kerangka halaman (topbar, sidebar, warna, tampilan kosong) ada di beranda.css */

/* ===== Label kategori ===== */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  padding: 3px 10px;
  font-size: 0.78rem;
  font-weight: 600;
  border-radius: 6px;
}

.tag-fasilitas    { color: #7c3aed; background: #efe7fd; }
.tag-kebersihan   { color: #15803d; background: #dcf5e6; }
.tag-kantin       { color: #c2570c; background: #fdeadb; }
.tag-pembelajaran { color: #0f766e; background: #d9f5f1; }
.tag-perpustakaan { color: #7c3aed; background: #efe7fd; }
.tag-keamanan     { color: #d13438; background: #fde4e4; }
.tag-lainnya      { color: #52525b; background: #eceef1; }

.tag-icon {
  padding: 6px 12px;
  font-size: 0.85rem;
}

.tag-icon svg {
  width: 15px;
  height: 15px;
}

/* ===== Label status ===== */
.badge {
  display: inline-block;
  padding: 7px 16px;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: center;
  border-radius: 8px;
}

.badge-menunggu { color: #b45f06; background: #fdf0cf; }
.badge-proses   { color: #2f6be6; background: #e1ecfd; }
.badge-selesai  { color: #1d7f57; background: #d8f3e6; }

/* ===== Daftar aspirasi (dipakai saat sudah ada data) ===== */
.aspirasi-list {
  list-style: none;
}

.aspirasi-list li + li {
  border-top: 1px solid var(--line);
}

.aspirasi-row {
  display: grid;
  grid-template-columns: 32px 1fr auto 130px;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  transition: background 0.2s;
}

.aspirasi-row:hover {
  background: #f6f9fe;
}

.row-no {
  color: var(--muted);
  font-size: 0.95rem;
}

.row-main {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.row-main strong {
  font-size: 0.98rem;
  font-weight: 500;
}

.row-date {
  font-size: 0.95rem;
  color: var(--muted);
  text-align: right;
}

/* ===== Halaman detail ===== */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--blue);
}

.back-link:hover {
  text-decoration: underline;
}

.back-link svg {
  width: 18px;
  height: 18px;
}

.detail-card {
  max-width: 980px;
  padding: 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.detail-title h1 {
  font-size: clamp(1.3rem, 2.6vw, 1.6rem);
  font-weight: 700;
  line-height: 1.3;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 20px;
  margin-top: 18px;
}

.date {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.95rem;
  color: #2b3240;
}

.date svg {
  width: 20px;
  height: 20px;
}

.status-box {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  min-width: 210px;
  padding: 18px 20px;
  font-size: 0.92rem;
  color: var(--muted);
  background: #eaf3ff;
  border-radius: 12px;
}

.detail-section {
  margin-top: 32px;
}

.detail-section h2,
.admin-reply h2 {
  font-size: 1.05rem;
  font-weight: 700;
}

.detail-section p {
  margin-top: 10px;
  max-width: 72ch;
  font-size: 0.95rem;
  line-height: 1.7;
  color: #2b3240;
}

/* ===== Tanggapan admin ===== */
.admin-reply {
  margin-top: 32px;
  padding: 20px 24px;
  background: #eef5ff;
  border: 1px solid #c9dcf8;
  border-radius: 12px;
}

.admin-reply h2 {
  color: var(--blue);
  font-weight: 600;
}

.admin-reply p {
  margin-top: 10px;
  font-size: 0.95rem;
  line-height: 1.6;
}

.admin-reply small {
  display: block;
  margin-top: 12px;
  font-size: 0.82rem;
  color: var(--muted);
}

/* ===== Riwayat status (timeline) ===== */
.timeline {
  list-style: none;
  margin-top: 18px;
}

.timeline li {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 0 26px 34px;
}

.timeline li:last-child {
  padding-bottom: 0;
}

/* titik */
.timeline li::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--dot);
  box-shadow: 0 0 0 4px var(--dot-ring);
}

/* garis penghubung */
.timeline li:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 22px;
  bottom: 0;
  left: 7px;
  width: 2px;
  background: var(--line);
}

.timeline .dot-green {
  --dot: #22a06b;
  --dot-ring: #d8f3e6;
}

.timeline .dot-blue {
  --dot: #2f6be6;
  --dot-ring: #dbe7fd;
}

.timeline time {
  font-size: 0.85rem;
  color: var(--muted);
}

.timeline strong {
  font-size: 0.95rem;
  font-weight: 500;
}

/* ===== Responsif ===== */
@media (max-width: 700px) {
  .detail-card {
    padding: 22px 18px;
  }

  .detail-head {
    flex-direction: column;
  }

  .status-box {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    min-width: 0;
  }

  .admin-reply {
    padding: 16px 18px;
  }

  /* baris daftar jadi bertumpuk di HP */
  .aspirasi-row {
    grid-template-columns: 24px 1fr auto;
    gap: 6px 12px;
    padding: 16px;
  }

  .row-date {
    grid-column: 2 / -1;
    text-align: left;
    font-size: 0.85rem;
  }
}
/* ===== CSS halaman Semua Aspirasi =====
   Kerangka (topbar, sidebar, tampilan kosong) ada di beranda.css.
   Label kategori & status ada di aspirasi-saya.css. */

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ===== Judul halaman ===== */
.page-head h1 {
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.page-head p {
  margin-top: 8px;
  font-size: 0.98rem;
  color: var(--muted);
}

/* ===== Pencarian & filter ===== */
.filters {
  display: grid;
  grid-template-columns: 1fr 200px 200px;
  gap: 14px;
  margin: 28px 0 20px;
}

.search,
.select-wrap {
  position: relative;
}

.search svg {
  position: absolute;
  top: 50%;
  left: 16px;
  width: 20px;
  height: 20px;
  transform: translateY(-50%);
  color: #4b5563;
  pointer-events: none;
}

.filters input,
.filters select {
  width: 100%;
  height: 48px;
  font: inherit;
  font-size: 0.95rem;
  color: var(--text);
  background: #fafbfc;
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.filters input {
  padding: 0 16px 0 46px;
}

.filters input::placeholder {
  color: #6b7280;
}

.filters select {
  appearance: none;
  -webkit-appearance: none;
  padding: 0 44px 0 16px;
  cursor: pointer;
}

.filters input:focus,
.filters select:focus {
  outline: none;
  background: #ffffff;
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(47, 107, 230, 0.18);
}

.select-wrap svg {
  position: absolute;
  top: 50%;
  right: 16px;
  width: 18px;
  height: 18px;
  transform: translateY(-50%);
  color: #1f2937;
  pointer-events: none;
}

/* ===== Kartu aspirasi (dipakai saat sudah ada data) ===== */
.asp-wrap {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.asp-card {
  display: grid;
  grid-template-columns: 1fr 130px 160px 24px;
  grid-template-areas:
    "code  code   code  chev"
    "title title  title chev"
    "tag   badge  date  chev";
  align-items: center;
  column-gap: 16px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.asp-card:hover {
  border-color: #c5d6f4;
  box-shadow: 0 6px 18px rgba(27, 58, 138, 0.08);
}

.asp-code  { grid-area: code;  font-size: 0.8rem; color: var(--muted); }
.asp-title { grid-area: title; margin: 4px 0 12px; font-size: 1rem; font-weight: 600; }
.asp-card .tag   { grid-area: tag; }
.asp-card .badge { grid-area: badge; justify-self: center; }

.asp-date {
  grid-area: date;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  color: #2b3240;
}

.asp-date svg {
  width: 16px;
  height: 16px;
}

.asp-chev {
  grid-area: chev;
  width: 20px;
  height: 20px;
  color: #4b5563;
}

/* label berbentuk pil di dalam kartu */
.asp-card .tag,
.asp-card .badge {
  padding: 5px 16px;
  font-size: 0.8rem;
  border-radius: 999px;
}

.tag-perpustakaan { color: #7c3aed; background: #efe7fd; }
.tag-keamanan     { color: #d13438; background: #fde4e4; }

/* ===== Pagination ===== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 8px;
}

.pages {
  display: flex;
  gap: 8px;
  margin: 0 auto;
}

.page-btn {
  min-width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  padding: 0 8px;
  font-size: 0.9rem;
  color: #1f2937;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.page-btn:hover {
  background: #eef2f7;
}

.page-btn.current {
  color: #ffffff;
  font-weight: 600;
  background: var(--blue);
  border-color: var(--blue);
}

.page-info {
  font-size: 0.85rem;
  color: var(--muted);
}

/* ===== Responsif ===== */
@media (max-width: 900px) {
  .filters {
    grid-template-columns: 1fr 1fr;
  }

  /* kotak pencarian selebar penuh di atas */
  .search {
    grid-column: 1 / -1;
  }
}

@media (max-width: 600px) {
  .filters {
    grid-template-columns: 1fr;
    margin-top: 22px;
  }

  .asp-card {
    grid-template-columns: auto 1fr 24px;
    grid-template-areas:
      "code  code  chev"
      "title title chev"
      "tag   badge chev"
      "date  date  chev";
    row-gap: 4px;
    padding: 14px 16px;
  }

  .asp-title {
    margin-bottom: 8px;
  }

  .asp-card .badge {
    justify-self: start;
  }

  .asp-date {
    margin-top: 8px;
  }

  .pagination {
    flex-direction: column;
  }

  .pages {
    margin: 0;
  }
}
/* ===== CSS halaman Panduan =====
   Kerangka (topbar, sidebar, warna) ada di beranda.css */

/* ===== Judul halaman ===== */
.page-head h1 {
  font-size: clamp(1.5rem, 3vw, 1.9rem);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.page-head p {
  margin-top: 8px;
  font-size: 0.98rem;
  color: var(--muted);
}

/* ===== Langkah-langkah (2 x 2) ===== */
.steps {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 28px;
}

.step-card {
  padding: 24px 26px 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.step-top {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
}

.step-no {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffffff;
  background: var(--blue);
  border-radius: 50%;
}

.step-icon {
  width: 30px;
  height: 30px;
  color: var(--blue);
}

.step-card h2 {
  font-size: 1.1rem;
  font-weight: 700;
}

.step-card p {
  margin-top: 8px;
  max-width: 34ch;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--muted);
}

/* ===== Kotak tips ===== */
.tips {
  margin-top: 28px;
  padding: 22px 26px 24px;
  background: #eef5ff;
  border: 1px solid #c9dcf8;
  border-radius: 14px;
}

.tips-head {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--blue);
}

.tips-head svg {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
}

.tips-head h2 {
  font-size: 1.05rem;
  font-weight: 600;
}

.tips ul {
  margin-top: 16px;
  padding-left: 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 0.95rem;
  color: #2b3240;
}

.tips li::marker {
  color: var(--blue);
}

/* ===== Status aspirasi ===== */
.status-info {
  margin-top: 36px;
}

.status-info h2 {
  font-size: 1.2rem;
  font-weight: 700;
}

.status-lead {
  margin: 6px 0 18px;
  font-size: 0.95rem;
  color: var(--muted);
}

.status-row {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.status-row + .status-row {
  margin-top: 14px;
}

.status-row p {
  font-size: 0.9rem;
  color: #2b3240;
  line-height: 1.5;
}

/* label status berbentuk pil, lebar sama di semua baris */
.status-pill {
  flex-shrink: 0;
  width: 150px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 5px 16px 5px 6px;
  font-size: 0.92rem;
  font-weight: 600;
  border-radius: 999px;
}

.pill-dot {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: #ffffff;
  border-radius: 50%;
}

.pill-dot svg {
  width: 18px;
  height: 18px;
}

.pill-menunggu         { color: #b45f06; background: #fdf0cf; }
.pill-menunggu .pill-dot { background: var(--yellow); }

.pill-proses           { color: #2f6be6; background: #e1ecfd; }
.pill-proses .pill-dot { background: var(--blue); }

.pill-selesai           { color: #1d7f57; background: #d8f3e6; }
.pill-selesai .pill-dot { background: var(--green); }

/* ===== Responsif ===== */
@media (max-width: 700px) {
  .steps {
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 22px;
  }

  .step-card {
    padding: 20px;
  }

  .step-top {
    margin-bottom: 14px;
  }

  .tips {
    padding: 18px 18px 20px;
  }

  .tips ul {
    padding-left: 32px;
  }

  /* label status di atas, penjelasan di bawahnya */
  .status-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 16px;
  }
}
/* ===== CSS halaman Keluar =====
   Kerangka (topbar, sidebar, warna) ada di beranda.css */

/* area konten: kartu di tengah, footer menempel di bawah */
.keluar-content {
  display: flex;
  flex-direction: column;
  padding: 40px clamp(16px, 4vw, 48px) 0;
  background: linear-gradient(180deg, #f1f7fe 0%, #f7fafd 100%);
}

/* ===== Kartu konfirmasi ===== */
.keluar-card {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 44px 28px 52px;
  text-align: center;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: 0 8px 28px rgba(27, 58, 138, 0.07);
}

.keluar-art {
  display: block;
  width: min(320px, 85%);
  height: auto;
  margin: 0 auto 22px;
}

.keluar-card h1 {
  font-size: clamp(1.5rem, 3.2vw, 1.9rem);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #14285e;
}

.keluar-text {
  max-width: 28ch;
  margin: 12px auto 0;
  font-size: 1rem;
  line-height: 1.6;
  color: #24407f;
}

/* ===== Tombol ===== */
.keluar-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: min(420px, 100%);
  margin: 32px auto 0;
}

.btn-cancel,
.btn-exit {
  height: 50px;
  padding: 0 16px;
  justify-content: center;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 10px;
}

.btn-cancel {
  display: inline-flex;
  align-items: center;
  color: #14285e;
  background: #ffffff;
  border: 1.5px solid #cddcf3;
  transition: background 0.2s;
}

.btn-cancel:hover {
  background: #f1f6fd;
}

.btn-exit svg {
  width: 22px;
  height: 22px;
}

/* ===== Kotak info ===== */
.keluar-info {
  display: flex;
  align-items: center;
  gap: 14px;
  width: min(420px, 100%);
  margin: 22px auto 0;
  padding: 16px 20px;
  text-align: left;
  font-size: 0.92rem;
  line-height: 1.55;
  color: #24407f;
  background: #eef4fd;
  border-radius: 10px;
}

.keluar-info svg {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  color: var(--blue);
}

/* ===== Footer ===== */
.keluar-footer {
  margin-top: auto;
  padding: 36px 0 22px;
  font-size: 0.85rem;
  color: var(--muted);
}

/* ===== Responsif ===== */
@media (max-width: 600px) {
  .keluar-content {
    padding-top: 24px;
  }

  .keluar-card {
    padding: 32px 18px 36px;
  }

  .keluar-actions {
    margin-top: 26px;
  }
}

@media (max-width: 380px) {
  /* tombol bertumpuk di layar sangat kecil, Keluar di atas */
  .keluar-actions {
    grid-template-columns: 1fr;
  }

  .btn-exit {
    order: -1;
  }
}

<script>
/* =========================================================
   app.js — Logika aplikasi Aspirasi Siswa
   Data disimpan di localStorage browser (tanpa server/database).
   File ini dipakai bersama oleh semua halaman.
   ========================================================= */

const ASPIRASI_KEY = 'aspirasiSiswaData';

const KATEGORI_LABEL = {
  fasilitas: 'Fasilitas',
  kebersihan: 'Kebersihan',
  kantin: 'Kantin',
  pembelajaran: 'Pembelajaran',
  keamanan: 'Keamanan',
  perpustakaan: 'Perpustakaan',
  lainnya: 'Lainnya'
};

const STATUS_LABEL = {
  menunggu: 'Menunggu',
  diproses: 'Diproses',
  selesai: 'Selesai'
};

const NAMA_BULAN = [
  'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
  'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
];

function formatTanggal(iso) {
  const d = new Date(iso);
  return `${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
}

/* ---------- Penyimpanan data (localStorage) ---------- */

function getData() {
  try {
    const raw = localStorage.getItem(ASPIRASI_KEY);
    if (!raw) return { nextNumber: 1, items: [] };
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.items)) return { nextNumber: 1, items: [] };
    return parsed;
  } catch (e) {
    return { nextNumber: 1, items: [] };
  }
}

function saveData(data) {
  localStorage.setItem(ASPIRASI_KEY, JSON.stringify(data));
}

function tambahAspirasi({ judul, kategori, isi }) {
  const data = getData();
  const nomor = data.nextNumber;

  const item = {
    id: nomor,
    kode: '#ASP-' + String(nomor).padStart(4, '0'),
    judul,
    kategori,
    isi,
    status: 'menunggu',
    tanggal: new Date().toISOString()
  };

  data.items.unshift(item);
  data.nextNumber = nomor + 1;
  saveData(data);
  return item;
}

function hitungStats() {
  const items = getData().items;
  return {
    total: items.length,
    menunggu: items.filter(i => i.status === 'menunggu').length,
    diproses: items.filter(i => i.status === 'diproses').length,
    selesai: items.filter(i => i.status === 'selesai').length
  };
}

/* ---------- Bantuan tampilan ---------- */

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function tagClass(kategori) {
  return 'tag tag-' + kategori;
}

function badgeClass(status) {
  return 'badge badge-' + status;
}

function buatBarisAspirasi(item, nomorUrut) {
  return `
    <li>
      <a href="detail-aspirasi.html?id=${item.id}" class="aspirasi-row">
        <span class="row-no">${nomorUrut}</span>
        <span class="row-main">
          <strong>${escapeHtml(item.judul)}</strong>
          <span class="${tagClass(item.kategori)}">${KATEGORI_LABEL[item.kategori] || 'Lainnya'}</span>
        </span>
        <span class="${badgeClass(item.status)}">${STATUS_LABEL[item.status]}</span>
        <time class="row-date">${formatTanggal(item.tanggal)}</time>
      </a>
    </li>`;
}

function buatKartuAspirasi(item) {
  return `
    <a href="detail-aspirasi.html?id=${item.id}" class="asp-card">
      <span class="asp-code">${item.kode}</span>
      <strong class="asp-title">${escapeHtml(item.judul)}</strong>
      <span class="${tagClass(item.kategori)}">${KATEGORI_LABEL[item.kategori] || 'Lainnya'}</span>
      <span class="${badgeClass(item.status)}">${STATUS_LABEL[item.status]}</span>
      <time class="asp-date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2"/>
          <path d="M4 10h16M9 3v4M15 3v4"/>
        </svg>
        ${formatTanggal(item.tanggal)}
      </time>
      <svg class="asp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </a>`;
}

/**
 * Menampilkan daftar aspirasi ke dalam sebuah container.
 * Kalau datanya kosong, tampilan "Belum ada aspirasi" (.empty) yang sudah
 * ada di HTML akan tetap dipakai / dikembalikan.
 */
function renderDaftar(containerEl, items, opts = {}) {
  if (!containerEl) return;

  if (items.length === 0) {
    const emptyTemplate = containerEl.querySelector('.empty');
    if (!emptyTemplate && containerEl.dataset.emptyHtml) {
      containerEl.innerHTML = containerEl.dataset.emptyHtml;
    }
    return;
  }

  // Simpan tampilan kosong aslinya (sekali saja) supaya bisa dipakai lagi
  // kalau nanti semua aspirasi dihapus / hasil filter kosong.
  const emptyNode = containerEl.querySelector('.empty');
  if (emptyNode && !containerEl.dataset.emptyHtml) {
    containerEl.dataset.emptyHtml = emptyNode.outerHTML;
  }

  if (opts.gaya === 'kartu') {
    containerEl.innerHTML = items.map(buatKartuAspirasi).join('');
  } else {
    const baris = items.map((it, idx) => buatBarisAspirasi(it, idx + 1)).join('');
    containerEl.innerHTML = `<ul class="aspirasi-list">${baris}</ul>`;
  }
}

function tampilkanKosongJikaPerlu(containerEl, items) {
  if (items.length > 0) return false;
  if (containerEl.dataset.emptyHtml) {
    containerEl.innerHTML = containerEl.dataset.emptyHtml;
  }
  return true;
}

/* ---------- Inisialisasi tiap halaman ---------- */

function initLogin() {
  // Di versi satu-halaman (SPA) ini, proses login ditangani oleh
  // initLoginScreen() pada router.js -- fungsi ini sengaja dikosongkan
  // supaya tidak memicu perpindahan halaman ganda.
}

function initBeranda() {
  const welcome = document.querySelector('.welcome h1');
  if (!welcome || !welcome.textContent.includes('Halo, Siswa')) return;

  // Simpan dulu tampilan kosong sebelum ditimpa
  const recentBox = document.querySelector('.recent .recent-box');
  if (recentBox) {
    const emptyNode = recentBox.querySelector('.empty');
    if (emptyNode) recentBox.dataset.emptyHtml = emptyNode.outerHTML;
  }

  const stats = hitungStats();
  const angka = document.querySelectorAll('.stats .stat-card .stat-top strong');
  if (angka.length >= 4) {
    angka[0].textContent = stats.total;
    angka[1].textContent = stats.menunggu;
    angka[2].textContent = stats.diproses;
    angka[3].textContent = stats.selesai;
  }

  const items = getData().items.slice(0, 3);
  if (!tampilkanKosongJikaPerlu(recentBox, items)) {
    renderDaftar(recentBox, items);
  }
}

function initKirimAspirasi() {
  const form = document.querySelector('.aspirasi-form');
  if (!form) return;

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const judulEl = document.getElementById('judul');
    const kategoriEl = document.getElementById('kategori');
    const isiEl = document.getElementById('isi');

    const judul = judulEl.value.trim();
    const kategori = kategoriEl.value;
    const isi = isiEl.value.trim();

    if (!judul || !kategori || !isi) return;

    tambahAspirasi({ judul, kategori, isi });

    // Balik ke halaman "Aspirasi saya" supaya langsung terlihat hasilnya
    location.hash = '#/aspirasi-saya';
  });
}

function initAspirasiSaya() {
  const welcome = document.querySelector('.welcome h1');
  if (!welcome || welcome.textContent.trim() !== 'Aspirasi saya') return;

  const box = document.querySelector('.recent-box');
  if (!box) return;

  const emptyNode = box.querySelector('.empty');
  if (emptyNode) box.dataset.emptyHtml = emptyNode.outerHTML;

  const items = getData().items;
  if (!tampilkanKosongJikaPerlu(box, items)) {
    renderDaftar(box, items);
  }
}

function initSemuaAspirasi() {
  const wrap = document.querySelector('.asp-wrap');
  if (!wrap) return;

  const emptyBox = wrap.querySelector('.recent-box');
  if (emptyBox) {
    const emptyNode = emptyBox.querySelector('.empty');
    if (emptyNode) wrap.dataset.emptyHtml = emptyNode.outerHTML;
  }

  function tampilkan() {
    const cariEl = document.getElementById('cari');
    const kategoriEl = document.getElementById('kategori');
    const statusEl = document.getElementById('status');

    const cari = (cariEl?.value || '').toLowerCase().trim();
    const kategori = kategoriEl?.value || '';
    const status = statusEl?.value || '';

    const items = getData().items.filter((it) => {
      const cocokCari = !cari || it.judul.toLowerCase().includes(cari);
      const cocokKategori = !kategori || it.kategori === kategori;
      const cocokStatus = !status || it.status === status;
      return cocokCari && cocokKategori && cocokStatus;
    });

    if (items.length === 0) {
      wrap.innerHTML = wrap.dataset.emptyHtml || '';
    } else {
      renderDaftar(wrap, items, { gaya: 'kartu' });
    }
  }

  const form = document.querySelector('.filters');
  if (form) {
    form.addEventListener('submit', (e) => e.preventDefault());
    form.addEventListener('input', tampilkan);
    form.addEventListener('change', tampilkan);
  }

  tampilkan();
}

function initDetailAspirasi(idDariRouter) {
  const root = document.querySelector('[data-detail-root]');
  if (!root) return;

  let id = idDariRouter;
  if (id === undefined || Number.isNaN(id)) {
    const params = new URLSearchParams(window.location.search);
    id = Number(params.get('id'));
  }
  const item = getData().items.find((it) => it.id === id);

  if (!item) {
    root.innerHTML = `
      <div class="empty">
        <h3>Aspirasi tidak ditemukan</h3>
        <p>Aspirasi yang kamu cari mungkin sudah dihapus atau tautannya salah.</p>
        <a href="aspirasi-saya.html" class="btn-outline">Kembali ke Aspirasi saya</a>
      </div>`;
    return;
  }

  document.title = item.judul + ' | Aspirasi Siswa';

  root.querySelector('[data-field="judul"]').textContent = item.judul;
  root.querySelector('[data-field="kode"]').textContent = item.kode;
  root.querySelector('[data-field="tanggal"]').textContent = formatTanggal(item.tanggal);
  root.querySelector('[data-field="isi"]').textContent = item.isi;

  const tagEl = root.querySelector('[data-field="kategori"]');
  tagEl.textContent = KATEGORI_LABEL[item.kategori] || 'Lainnya';
  tagEl.className = tagClass(item.kategori);

  const statusEl = root.querySelector('[data-field="status"]');
  statusEl.textContent = STATUS_LABEL[item.status];
  statusEl.className = badgeClass(item.status);

  const tanggalTampil = formatTanggal(item.tanggal);
  const langkah = [
    { label: 'Aspirasi terkirim', dot: 'dot-blue' }
  ];
  if (item.status === 'diproses' || item.status === 'selesai') {
    langkah.push({ label: 'Sedang diproses pihak sekolah', dot: 'dot-blue' });
  }
  if (item.status === 'selesai') {
    langkah.push({ label: 'Aspirasi selesai ditangani', dot: 'dot-green' });
  }

  const timelineEl = root.querySelector('[data-field="timeline"]');
  timelineEl.innerHTML = langkah.map((s) => `
    <li class="${s.dot}">
      <strong>${s.label}</strong>
      <time>${tanggalTampil}</time>
    </li>`).join('');
}

// (Auto-init DOMContentLoaded dihapus di versi SPA -- router.js yang mengatur ini)

</script>

<script>
/* =========================================================
   router.js — Router sederhana berbasis hash (#/beranda, dst.)
   supaya seluruh aplikasi bisa jalan sebagai SATU halaman/link.
   ========================================================= */

const screenLogin = document.getElementById('screen-login');
const screenApp   = document.getElementById('screen-app');
const contentArea = document.getElementById('content-area');

const ROUTES = ['beranda', 'kirim', 'aspirasi-saya', 'semua-aspirasi', 'panduan', 'keluar', 'detail'];

function showAppScreen() {
  screenLogin.style.display = 'none';
  screenApp.style.display = '';
}

function showLoginScreen() {
  screenApp.style.display = 'none';
  screenLogin.style.display = '';
}

function updateActiveNav(route) {
  document.querySelectorAll('.sidebar .nav-item[data-nav]').forEach((a) => {
    const aktif = a.dataset.nav === route;
    a.classList.toggle('active', aktif);
    if (aktif) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

function renderRoute(route, params) {
  contentArea.className = route === 'keluar' ? 'content keluar-content' : 'content';
  const tpl = document.getElementById('tpl-' + route);
  contentArea.innerHTML = tpl ? tpl.innerHTML : '';
  updateActiveNav(route);
  window.scrollTo(0, 0);

  if (route === 'beranda') initBeranda();
  else if (route === 'kirim') initKirimAspirasi();
  else if (route === 'aspirasi-saya') initAspirasiSaya();
  else if (route === 'semua-aspirasi') initSemuaAspirasi();
  else if (route === 'detail') initDetailAspirasi(Number(params.get('id')));

  const menuToggle = document.getElementById('menu-toggle');
  if (menuToggle) menuToggle.checked = false;
}

function handleHashChange() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [route, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  const finalRoute = ROUTES.includes(route) ? route : 'beranda';
  renderRoute(finalRoute, params);
}

function logout() {
  sessionStorage.removeItem('aspirasiLoggedIn');
  showLoginScreen();
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href) return;

  if (href === 'index.html') {
    e.preventDefault();
    logout();
    return;
  }

  const mapLangsung = {
    'beranda.html': 'beranda',
    'kirim-aspirasi.html': 'kirim',
    'aspirasi-saya.html': 'aspirasi-saya',
    'semua-aspirasi.html': 'semua-aspirasi',
    'panduan.html': 'panduan',
    'keluar.html': 'keluar'
  };

  if (mapLangsung[href]) {
    e.preventDefault();
    location.hash = '#/' + mapLangsung[href];
    return;
  }

  if (href.indexOf('detail-aspirasi.html') === 0) {
    e.preventDefault();
    const qs = href.split('?')[1] || '';
    const id = new URLSearchParams(qs).get('id');
    location.hash = '#/detail?id=' + id;
  }
});

window.addEventListener('hashchange', handleHashChange);

function initLoginScreen() {
  const form = screenLogin.querySelector('.login-form');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('aspirasiLoggedIn', 'yes');
      showAppScreen();
      if (location.hash.replace(/^#\/?/, '') === 'beranda') {
        handleHashChange();
      } else {
        location.hash = '#/beranda';
      }
    });
  }

  const pwd = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  if (pwd && toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const isHidden = pwd.type === 'password';
      pwd.type = isHidden ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initLoginScreen();
  if (sessionStorage.getItem('aspirasiLoggedIn') === 'yes') {
    showAppScreen();
    handleHashChange();
  } else {
    showLoginScreen();
  }
});
</script>

</body>
</html>
